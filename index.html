:root {
  /* Layout: eine helle, ruhige Spalte. Jeder Hauptbereich beginnt mit einem gezeichneten Saunamotiv (Ölflaschen, Birkenzweige, Ofen, Kelle); unten eine feste Leiste mit den vier Bereichen. Listen sind knapp, Einzelheiten öffnen sich per Tippen. */
  --bg: #faf8f4;
  --surface: #ffffff;
  --surface-2: #f2eee7;
  --ink: #2b2620;
  --muted: #6e665c;
  --line: #e6e0d6;
  --accent: #b05e22;
  --accent-soft: #f6e8db;
  --accent-ink: #ffffff;
  --ice: #a6d4e8;
  --ice-soft: #e4f1f7;
  --ice-deep: #2c7aa0;
  --shine: #ffffff;
  --good: #2d7a4b;
  --rule: #7c9784;
  --open: #c9c0b3;
  --warn: #a33a1c;
  --f-nadel: #2e6a4c;
  --f-holz: #83552f;
  --f-minze: #1f7d74;
  --f-zitrus: #8f6000;
  --f-kraeuter: #5a7022;
  --f-gewuerze: #a53f25;
  --f-blueten: #7454a1;
  /* Duftnoten: Kopf luftig blau, Herz rosé, Basis holzbraun */
  --n-kopf: #2c7aa0;
  --n-herz: #b8475d;
  --n-basis: #83552f;
  /* Schriften (eingebettet): große Titel in Instrument Serif, Überschriften in Fraunces, Text in Outfit */
  --font-title: "Instrument Serif", Georgia, "Times New Roman", serif;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Outfit", Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
  --nav-h: 64px;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom, 0px)); }

/* Kopfbild der Hauptbereiche */
.banner { position: relative; z-index: 0; overflow: hidden; margin: 0 -16px 16px; padding: 18px 16px 12px; min-height: 88px; background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%); border-bottom: 1px solid var(--line); }
.banner-title { position: relative; font-family: var(--font-title); font-weight: 400; font-synthesis: none; font-size: 44px; line-height: 1; letter-spacing: -.005em; }
.banner-sub { position: relative; margin: 6px 0 0; max-width: 62%; color: var(--muted); font-size: 14px; line-height: 1.35; }
.banner-art { position: absolute; z-index: -1; right: 0; bottom: 0; width: 32%; max-width: 150px; pointer-events: none; }
.banner-art svg, .detail-art svg { display: block; width: 100%; height: auto; }
.banner-art.mirror svg { transform: scaleX(-1); }

/* Unterseiten */
.topbar { position: sticky; top: 0; z-index: 10; margin: 0 -16px; padding: 6px 8px; background: var(--bg); }
.back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 6px 12px 6px 4px; border: 0; border-radius: 10px; background: none; color: var(--accent); font-weight: 700; cursor: pointer; }
.detail { position: relative; z-index: 0; padding-top: 4px; }
.detail-art { position: absolute; z-index: -1; right: -10px; top: -8px; width: 128px; opacity: .22; pointer-events: none; }
.over { margin: 6px 0 4px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.page-title { font-family: var(--font-title); font-weight: 400; font-synthesis: none; font-size: 46px; line-height: 1.02; letter-spacing: -.01em; overflow-wrap: break-word; hyphens: auto; }
.page-sub { margin: 8px 0 0; font-size: 18px; line-height: 1.4; }
.fam-label { --famc: var(--muted); display: inline-flex; align-items: center; gap: 8px; margin: 6px 0 4px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--famc); }
.fam-label .dot, .group-label .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--famc); flex: 0 0 auto; }
.text { margin: 0; }
.pre { white-space: pre-wrap; }
.present { margin: 14px 0 0; font-size: 18px; line-height: 1.5; white-space: pre-wrap; }
/* Öl-Seite: Kopfbereich mit Bild, Duftnoten-Skala, Stichworte */
.oil-page { padding-top: 2px; }
.oil-hero { position: relative; z-index: 0; overflow: hidden; margin: 2px 0 0; padding: 16px 16px 18px; border-radius: 22px; background: #f6f1e8; background: var(--tint); }
.oil-art { position: absolute; z-index: -1; right: -10px; top: -8px; width: 128px; height: 128px; opacity: .55; pointer-events: none; }
.oil-hero .fam-label { margin: 0 0 6px; }
.oil-hero .page-title { margin: 0; padding-right: 20px; hyphens: manual; overflow-wrap: anywhere; }
.facts2 { display: grid; gap: 10px; margin-top: 16px; }
.fact { display: grid; grid-template-columns: 82px minmax(0, 1fr); align-items: center; gap: 8px; }
.fact-k { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.scale { display: flex; flex-wrap: wrap; gap: 4px; }
.scale span { display: grid; place-items: center; width: 42px; height: 30px; border-radius: 999px; background: rgba(255, 255, 255, .72); border: 1px solid rgba(43, 38, 32, .07); }
.scale .nt { width: 18px; height: 18px; opacity: .4; }
.scale .on { border-color: transparent; }
.scale .on .nt { fill: #fff; opacity: 1; }
.scale .sc-kopf.on { background: var(--n-kopf); }
.scale .sc-herz.on { background: var(--n-herz); }
.scale .sc-basis.on { background: var(--n-basis); }
/* Duftnoten-Piktogramme und Legende */
.nt { display: block; flex: 0 0 auto; width: 18px; height: 18px; }
.nt-kopf { fill: var(--n-kopf); }
.nt-herz { fill: var(--n-herz); }
.nt-basis { fill: var(--n-basis); }
.note-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; margin: 24px 0 4px; font-size: 13px; color: var(--muted); }
.note-legend span { display: inline-flex; align-items: center; gap: 6px; }
.note-legend .nt { width: 16px; height: 16px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.tags li { padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, .86); font-size: 14px; line-height: 1.3; }
.hero-note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.btn-wide { flex: 1 1 auto; }
.sec-head { display: flex; align-items: center; gap: 8px; }
.sec-head svg { flex: 0 0 auto; }
.sec-head .count, .label .count { font-family: var(--font-body); font-size: 15px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
.sec-sub { margin: -4px 0 10px; font-size: 13px; color: var(--muted); }
.chip-more { border-style: dashed; color: var(--accent); font-weight: 700; }
.bullets { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.bullets li { position: relative; padding-left: 20px; line-height: 1.45; }
.bullets li::before { content: ""; position: absolute; left: 4px; top: .55em; width: 8px; height: 8px; border-radius: 50%; background: var(--famc, var(--accent)); }
.src-foot { display: grid; gap: 4px; margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.src-foot p { margin: 0; }
.row-ico { display: grid; place-items: center; flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px; background: #f6f1e8; background: var(--tint); }
.row-ico svg { width: 36px; height: 36px; }
.muted { color: var(--muted); }

.section { margin-top: 28px; }
.label { margin: 0 0 10px; font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1.25; color: var(--ink); }
h3.label { font-size: 17px; }
.note { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
.empty { margin: 18px 0 0; color: var(--muted); }
.err { margin: 0; color: var(--warn); font-weight: 700; }
.info { margin: 0 0 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-size: 14px; }

/* Eingaben */
input[type="search"], input[type="text"], input[type="number"], select, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .85; }
textarea { min-height: 76px; resize: vertical; }
.search { position: relative; }
.search > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { padding-left: 40px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .flabel { font-size: 14px; font-weight: 700; }
.picker { margin-top: 12px; }
.picker-results { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.picker-results:empty { display: none; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.scroller { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 12px -16px 0; padding: 0 16px 2px; }
.scroller::-webkit-scrollbar { display: none; }
.chip { --famc: var(--muted); display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; min-height: 36px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 15px; line-height: 1.2; cursor: pointer; text-decoration: none; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--famc); flex: 0 0 auto; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip-static { cursor: default; color: var(--muted); }
.chip .x, .chip .plus { font-weight: 700; color: var(--muted); }

/* Knöpfe */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 11px 18px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; line-height: 1.2; cursor: pointer; text-decoration: none; }
.btn-ghost { background: var(--surface); color: var(--accent); }
.btn-quiet { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-danger { background: var(--surface); border-color: var(--warn); color: var(--warn); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.linkbtn { padding: 0; border: 0; background: none; color: var(--accent); font-weight: 700; text-align: left; cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

/* Listen */
.list { display: grid; gap: 8px; }
.row { --famc: var(--line); display: flex; align-items: center; gap: 10px; width: 100%; min-height: 60px; padding: 10px 10px 10px 14px; text-align: left; color: inherit; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--famc); border-radius: 12px; cursor: pointer; }
.row:active { background: var(--surface-2); }
.row.own { --famc: var(--ice-deep); }
.row.auf { --famc: var(--accent); }
.row-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.row-name { font-size: 17px; font-weight: 700; line-height: 1.3; overflow-wrap: break-word; }
.row-sub { font-size: 14px; line-height: 1.35; color: var(--muted); }
.row-warn { color: var(--warn); }
.row-note { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 3px; }
.row-note .nt { width: 20px; height: 20px; }
.row > svg { flex: 0 0 auto; color: var(--muted); }
.group { margin-top: 24px; }
.group-label { --famc: var(--muted); display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1.25; color: var(--ink); }
.group-label .count { font-family: var(--font-body); font-size: 15px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
.foot { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); display: grid; justify-items: start; gap: 8px; }

/* Eiskugel */
.stage { margin-top: 16px; padding: 6px 6px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.stage svg.ball { display: block; width: 100%; height: auto; max-height: 420px; }
.ice-ball { fill: url(#iceGrad); stroke: var(--ice-deep); stroke-opacity: .5; stroke-width: 1.5; }
.ice-shine { fill: var(--shine); opacity: .6; }
.ice-speck { fill: var(--shine); opacity: .7; }
.ice-puddle { fill: var(--ice); opacity: .28; }
.ice-empty { font-family: var(--font-body); font-size: 15px; fill: var(--muted); }
.node-dot { fill: var(--famc); stroke: var(--surface); stroke-width: 3; }
.node-label { font-family: var(--font-body); font-size: 15px; font-weight: 700; fill: var(--ink); }
.node-new { transform-box: fill-box; transform-origin: center; animation: pop .4s ease-out; }
@keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }
.ln { fill: none; stroke-linecap: round; }
.ln-gut { stroke: var(--good); stroke-width: 5; }
.ln-regel { stroke: var(--rule); stroke-width: 3; stroke-dasharray: 9 7; stroke-linecap: butt; }
.ln-offen { stroke: var(--open); stroke-width: 3; stroke-dasharray: 1 8; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; padding: 2px 8px 0; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.warnbox { margin: 12px 0 0; padding: 10px 12px; border-left: 4px solid var(--warn); border-radius: 8px; background: var(--surface); font-size: 15px; }
.warnbox strong { color: var(--warn); }

/* Aufguss */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 20px; padding: 4px; border-radius: 12px; background: var(--surface-2); }
.seg button { min-height: 42px; padding: 8px 4px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 700; font-size: 15px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(43, 38, 32, .14); }
.seg-body { margin-top: 14px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.step { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.step-no { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ice-soft); color: var(--ice-deep); font-weight: 700; }
.step-main { display: grid; gap: 3px; min-width: 0; align-content: start; }
.step-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.step-meta { font-size: 14px; color: var(--muted); }
.step-music { font-size: 15px; overflow-wrap: anywhere; }
.step-text { margin: 4px 0 0; font-size: 15px; white-space: pre-wrap; }
.playlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.playlist li { display: grid; gap: 2px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-wrap: anywhere; }

/* Formulare */
.form { display: grid; gap: 16px; margin-top: 18px; }
.rounds { display: grid; gap: 12px; }
.round-card { margin: 0; min-width: 0; display: grid; gap: 12px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.round-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; }
.round-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.icon-btns { display: flex; gap: 6px; }
.icon-btn { display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); cursor: pointer; }
.two { display: grid; grid-template-columns: 1fr 96px; gap: 10px; }

/* Infos */
.legend-list, .note-list { display: grid; gap: 14px; margin: 0; }
.legend-list div, .note-list div { display: grid; gap: 4px; }
.legend-list dt, .note-list dt { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.note-list dt .nt { width: 20px; height: 20px; }
.legend-list dd, .note-list dd { margin: 0; color: var(--ink); }
.fam-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.fam-list li { display: grid; gap: 2px; }
.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.subhead { margin: 14px 0 6px; font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.srcgroup { margin-top: 12px; }
.srcgroup ul { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 4px; }

/* Untere Leiste */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bar-in { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 640px; margin: 0 auto; }
.nav { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: var(--nav-h); padding: 6px 2px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; }
.nav-ic { display: grid; place-items: center; width: 56px; height: 30px; border-radius: 999px; }
.nav[aria-current="page"] { color: var(--accent); }
.nav[aria-current="page"] .nav-ic { background: var(--accent-soft); }

.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--surface); font-weight: 700; font-size: 14px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 360px) { .banner-title { font-size: 40px; } .page-title { font-size: 42px; } .row-name { font-size: 16px; } .two { grid-template-columns: 1fr 84px; } }
@media (max-width: 380px) { .fact { grid-template-columns: 1fr; gap: 6px; } .oil-hero .page-title { padding-right: 6px; } }
/* Startseite: Suche bleibt oben, Duftfamilien als Kacheln, A–Z, einzeilige Zeilen */
.search-sticky { position: sticky; top: 0; z-index: 9; margin: 0 -16px; padding: 6px 16px 10px; background: var(--bg); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 6px; }
.tile { position: relative; z-index: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 2px; padding: 62px 12px 12px 14px; border: 1px solid rgba(43, 38, 32, .06); border-radius: 18px; background: #f6f1e8; background: var(--tint); color: inherit; font: inherit; text-align: left; cursor: pointer; }
.tile:active { transform: scale(.98); }
.tile-art { position: absolute; z-index: -1; right: -4px; top: -4px; width: 62px; height: 62px; }
.tile-name { max-width: 100%; font-family: var(--font-display); font-size: 18px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.tile-count { font-size: 13px; color: var(--muted); }
.tile-all { background: var(--surface); border-color: var(--line); }
.tile-az { position: absolute; right: 12px; top: 8px; font-family: var(--font-title); font-size: 34px; font-weight: 400; font-synthesis: none; line-height: 1; color: var(--line); }
.topbar-static { position: static; }
.fam-hero { position: relative; z-index: 0; overflow: hidden; margin: 2px 0 6px; padding: 14px 16px 16px; border-radius: 22px; background: #f6f1e8; background: var(--tint); }
.fam-hero-all { background: var(--surface); border: 1px solid var(--line); }
.fam-art { position: absolute; z-index: -1; right: -8px; top: -8px; width: 104px; height: 104px; opacity: .6; pointer-events: none; }
.fam-hero .fam-label { margin: 0 0 4px; }
.fam-hero .page-title { margin: 0; padding-right: 20px; hyphens: manual; overflow-wrap: anywhere; }
.fam-count { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.letter-group + .letter-group { margin-top: 4px; }
.letter { margin: 16px 0 8px; font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--muted); }
.hits { margin: 2px 0 10px; font-size: 13px; color: var(--muted); }
.row-oil { min-height: 58px; padding-top: 7px; padding-bottom: 7px; }
.row-oil .row-ico { width: 42px; height: 42px; }
.row-oil .row-ico svg { width: 34px; height: 34px; }
.row-own { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 700; vertical-align: 2px; }
/* Duftkreis (Infos → Duftfamilien): Nachbarn harmonieren, Antippen zeigt alle passenden Familien */
.wheel { margin: 6px 0 20px; }
.wheel-svg { display: block; width: 100%; max-width: 340px; height: auto; margin: 0 auto; -webkit-user-select: none; user-select: none; }
.wh-slice, .wh-hubg { cursor: pointer; }
.wh-slice { transition: opacity .2s; }
.wh-slice:focus { outline: none; }
.wh-bg { fill: var(--famc); fill-opacity: .13; stroke: var(--bg); stroke-width: 3; transition: fill-opacity .2s; }
.wh-slice:focus-visible .wh-bg { stroke: var(--famc); }
.wh-name { font-family: var(--font-body); font-size: 12.5px; font-weight: 700; fill: var(--famc); text-anchor: middle; }
.wh-slice.is-sel .wh-bg { fill-opacity: .32; }
.wh-slice.is-off { opacity: .25; }
.wh-hub { fill: var(--surface); stroke: var(--line); }
.wh-c1 { font-family: var(--font-body); font-size: 12px; fill: var(--muted); text-anchor: middle; }
.wh-c2 { font-family: var(--font-display); font-size: 18px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
.wh-hint { text-align: center; }
.wh-cap { margin: 12px 0 8px; font-size: 15px; text-align: center; }
.wheel .chips { justify-content: center; }
.wh-c3 { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
.wheel-oil { margin: 2px 0 14px; }
.wheel-oil .wheel-svg { max-width: 300px; }
/* Duftnoten-Balance beim Mischen */
.bal-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 6px; }
.bal-pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 14px 6px 11px; border-radius: 999px; border: 1.5px dashed #d9cfc0; color: var(--muted); font-size: 15px; font-weight: 700; line-height: 1.2; }
.bal-pill .nt { width: 20px; height: 20px; opacity: .45; }
.bal-pill.on { border-style: solid; border-color: transparent; color: #fff; }
.bal-pill.on .nt { fill: #fff; opacity: 1; }
.bal-kopf.on { background: var(--n-kopf); }
.bal-herz.on { background: var(--n-herz); }
.bal-basis.on { background: var(--n-basis); }
.bal-msg { display: flex; align-items: center; gap: 8px; margin: 12px 0 8px; font-size: 15px; color: var(--muted); }
.bal-msg .nt { width: 18px; height: 18px; }
.bal-ok { color: var(--good); font-weight: 700; }
</style>
</head>

durchgehend naturrein","Für die klassischen Spitzner-Aufgüsse (Saunamed, Ingwer-Limette usw.) nennt der Hersteller „natürliche und naturidentische“ Öle, in der Inhaltsliste steht teils „Aroma“. Naturrein ist bei Spitzner die Pure-Nature-Oil-Reihe.","https://www.medpex.de/spitzner-saunaaufguss-saunamed-hydro/02470678"],"safety":{"quelle":["Nie unverdünnt auf Ofen oder Steine geben. Die Öle verdampfen schlagartig und sind entzündlich. Immer in Wasser oder auf Eis verwenden.","Sparsam dosieren und zwischendurch lüften.","Pfefferminze/Menthol und Eukalyptus nicht bei Babys und Kleinkindern. In der Schwangerschaft und bei Kleinkindern ätherische Öle nur nach fachlicher Beratung einsetzen.","Latschenkiefer kann Haut und Schleimhäute reizen. Für Babys und Kinder nicht geeignet.","Zitrusöle auf der Haut machen lichtempfindlich (relevant bei Peelings und anderen Hautanwendungen)."],"eigen":["Nur tropfenweise: Zimt und Cassia, Nelke, Thymian (Thymol-Typ), Oregano, Bohnenkraut. Sie reizen in der Hitze Augen und Schleimhäute. Ebenso sparsam: Kampfer, Wintergrün und Birke süß, Salbei, Ysop (nur Cineol-Typ), Fenchel, Sternanis, Heiliger Basilikum, Birken- und Cadeteer.","Polei-Minze enthält viel Pulegon: nicht in der Schwangerschaft und nicht bei Kindern verwenden, sonst nur tropfenweise.","Nicht für den Aufguss: Thuja („Cedernblätteröl“), Kalmus und Beifuß. Sie enthalten giftige Stoffe (Thujon bzw. Asaron), stehen aber teils in Öl-Shops wie aromen123 im Sortiment."]},"sources":[["Hersteller & Sortimente",[["Pure Nature Oil – Shop","https://www.pure-nature-oil.shop/"],["Pure Nature Oil – Natur-Aufgüsse (Spitzner)","https://www.spitzner.de/collections/natur-saunaaufgusse-100-naturlich-ready-to-use"],["aromen123 – Sauna-Ratgeber","https://aromen123.de/Magazin/AEtherische-OEle-fuer-die-Sauna-der-perfekte-Aufguss/"],["aromen123 – Duftfamilien","https://aromen123.de/Zitrus/"],["Warda","https://www.saunashop-saunazubehoer.de/hochwertige-naturreine-aetherische-oele-von-warda.html"],["TA <script>
(function () {
"use strict";
const DATA = JSON.parse(document.getElementById("app-data").textContent);
const ART = JSON.parse(document.getElementById("app-art").textContent);
const LOCAL = window.DK_LOCAL === true;
const LS_KEY = "aufguss-duftkompass";
const FAM = Object.fromEntries(DATA.families.map(f => [f.id, f]));
const MOOD = Object.fromEntries(DATA.moods.map(m => [m.id, m]));
const BLEND = Object.fromEntries(DATA.blends.map(b => [b.id, b]));
const BUILTIN = new Set(DATA.oils.map(o => o.id));
const MAX_MIX = 8;
const APP_VERSION = "2.1";
const MAX_ROUNDS = 8;
const REF_RE = /^(b|k|o):[A-Za-z0-9_.~:@+\-]+$/;
const TRIAD = ["minze", "nadel", "zitrus"];
const STATUS = {
  bewaehrt: { label: "Bewährt", w: 3 },
  passt: { label: "Passt", w: 2 },
  eigene: { label: "Eigene", w: 3 },
  familie: { label: "Familienregel", w: 1 },
  gleich: { label: "Gleiche Familie", w: 0.5 },
  offen: { label: "Keine Angabe", w: 0 }
};

function newForm(oele) { return { id: null, name: "", oele: oele || [], stimmung: "sonst", notiz: "", err: "" }; }
function newOilForm() { return { id: null, name: "", familie: "zitrus", note: "", duft: "", passt: [], hinweis: "", err: "" }; }
function newRound(mix) { return { mischung: mix || "", musik: "", dauer: "", notiz: "" }; }
function newAufForm(mix) { return { id: null, name: "", beschreibung: "", runden: [newRound(mix)], notizen: "", err: "" }; }

const S = {
  route: { view: "oele" }, scroll: {}, query: "", fam: null, mood: null,
  kombis: [], oele: [], aufguesse: [],
  db: "loading", canWrite: null, readOnly: false, busy: false,
  form: newForm(), oilForm: newOilForm(), aufForm: newAufForm(), aufTab: "runden", more: null, lastList: null, wheel: null,
  confirm: null, copyText: null, focus: null, lastAdded: null,
  backupText: null, importOpen: false, importText: "", importErr: ""
};

/* ---------- Hilfen ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s == null ? "" : s).toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").normalize("NFD").replace(/[̀-ͯ]/g, "");
const byName = (a, b) => a.name.localeCompare(b.name, "de");
const byDate = (a, b) => String(b.erstellt || "").localeCompare(String(a.erstellt || ""));
const famVar = f => "--famc: var(--f-" + (FAM[f] ? f : "holz") + ")";
const base = f => (f === "nadel" ? "holz" : f);
const shortName = o => o.name.split(" / ")[0];
const moodName = id => (MOOD[id] || MOOD.sonst).name;
const pk = (a, b) => (a < b ? a + "|" + b : b + "|" + a);

/* ---------- Index aus Daten und eigenen Einträgen ---------- */
let OIL = new Map(), PAIRS = new Map(), COUNT = null;
function blendItems(b) {
  return b.items.map(it => {
    if (it.charAt(0) === "=") return { id: null, label: it.slice(1) };
    const parts = it.split("|");
    const o = OIL.get(parts[0]);
    return { id: parts[0], label: parts[1] || (o ? o.name : parts[0]) };
  });
}
function blendIds(b) { return Array.from(new Set(blendItems(b).map(x => x.id).filter(Boolean))); }
function reindex() {
  OIL = new Map();
  for (const o of DATA.oils) OIL.set(o.id, o);
  for (const c of S.oele) OIL.set(c.id, { id: c.id, name: c.name, fam: c.familie, note: c.note, duft: c.duft, passt: c.passt, hinweis: c.hinweis, aliases: [], src: [], eigen: true });
  PAIRS = new Map();
  COUNT = null;
  const add = (a, b, kind, val) => {
    if (!a || !b || a === b || !OIL.has(a) || !OIL.has(b)) return;
    const k = pk(a, b);
    let p = PAIRS.get(k);
    if (!p) { p = { src: new Set(), blends: [], eigen: false }; PAIRS.set(k, p); }
    if (kind === "passt") p.src.add(val);
    else if (kind === "blend") { if (p.blends.indexOf(val) < 0) p.blends.push(val); }
    else p.eigen = true;
  };
  for (const o of OIL.values()) {
    for (const ref of o.passt || []) {
      const targets = ref.charAt(0) === "@"
        ? Array.from(OIL.values()).filter(x => !x.eigen && x.fam === ref.slice(1) && x.id !== o.id).map(x => x.id)
        : [ref];
      for (const t of targets) {
        if (o.eigen) add(o.id, t, "eigen");
        else for (const s of o.src || []) add(o.id, t, "passt", s[0]);
      }
    }
  }
  for (const b of DATA.blends) {
    const ids = blendIds(b);
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) add(ids[i], ids[j], "blend", b.id);
  }
}
function famRule(fa, fb) {
  if (fa !== fb && TRIAD.indexOf(fa) >= 0 && TRIAD.indexOf(fb) >= 0) return "sauna";
  const a = base(fa), b = base(fb);
  if (a !== b && ((DATA.rules[a] || []).indexOf(b) >= 0 || (DATA.rules[b] || []).indexOf(a) >= 0)) return "tabelle";
  // Eigene Einordnung: Zitrus, Minze & Eukalyptus und Nadelholz passen in der Sauna zu allen Duftfamilien
  if (a !== b && (TRIAD.indexOf(fa) >= 0 || TRIAD.indexOf(fb) >= 0)) return "allround";
  return null;
}
function kombisWith(ids) { return S.kombis.filter(k => ids.every(id => k.oele.indexOf(id) >= 0)); }
function pairInfo(a, b) {
  const p = PAIRS.get(pk(a, b));
  const oa = OIL.get(a), ob = OIL.get(b);
  const i = { blends: p ? p.blends : [], src: p ? Array.from(p.src) : [], eigen: p ? p.eigen : false, own: kombisWith([a, b]), rule: null, same: false };
  if (oa && ob) { i.rule = famRule(oa.fam, ob.fam); i.same = base(oa.fam) === base(ob.fam); }
  i.best = i.blends.length ? "bewaehrt" : i.src.length ? "passt" : (i.own.length || i.eigen) ? "eigene" : i.rule ? "familie" : i.same ? "gleich" : "offen";
  return i;
}
function rank(o, q) {
  const names = [o.name].concat(o.aliases || []).map(norm);
  if (names.some(n => n === q)) return 0;
  if (names.some(n => n.indexOf(q) === 0)) return 1;
  if (names.some(n => n.split(/[\s\/\-()·]+/).some(w => w.indexOf(q) === 0))) return 2;
  if (names.some(n => n.indexOf(q) >= 0)) return 3;
  if (norm(o.duft).indexOf(q) >= 0 || norm(o.note).indexOf(q) >= 0) return 5;
  return 9;
}
function searchOils(q, exclude) {
  const nq = norm(String(q || "").trim());
  if (!nq) return [];
  exclude = exclude || [];
  return Array.from(OIL.values()).filter(o => exclude.indexOf(o.id) < 0)
    .map(o => ({ o: o, r: rank(o, nq) })).filter(x => x.r < 9)
    .sort((a, b) => a.r - b.r || byName(a.o, b.o)).map(x => x.o);
}
function suggestions(sel) {
  if (!sel.length) return [];
  const need = Math.max(1, Math.ceil(sel.length / 2));
  const out = [];
  for (const o of OIL.values()) {
    if (sel.indexOf(o.id) >= 0) continue;
    let score = 0, strong = 0, ok = true;
    for (const s of sel) {
      const st = pairInfo(o.id, s).best;
      if (st === "offen") { ok = false; break; }
      if (st === "bewaehrt" || st === "passt" || st === "eigene") strong++;
      score += STATUS[st].w;
    }
    if (ok && strong >= need) out.push({ o: o, score: score, strong: strong });
  }
  out.sort((x, y) => y.strong - x.strong || y.score - x.score || byName(x.o, y.o));
  return out.slice(0, 8);
}
function kombiTitle(k) {
  if (k.name && k.name.trim()) return k.name.trim();
  return k.oele.map(id => (OIL.get(id) ? shortName(OIL.get(id)) : "?")).join(" + ");
}
function uniqSrc(src) {
  const seen = new Set(), out = [];
  for (const s of src || []) { if (!seen.has(s[0])) { seen.add(s[0]); out.push(s); } }
  return out;
}

/* Duftnoten als farbige Piktogramme: Kopf (von vorn), Herz, Quadrat für die Basis */

const svgIcon = (size, body, sw) => '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + body + "</svg>";

function oilChip(id, opts) {

  const label = esc(opts.label || o.name);

  if (opts.remove) return '<button type="button" class="chip"' + st + ' data-action="' + opts.remove + '" data-id="' + esc(id) + '" aria-label="' + label + ' entfernen"><span class="dot"></span>' + label + '<span class="x" aria-hidden="true">✕</span></button>';
  if (opts.add) return '<button type="button" class="chip"' + st + ' data-action="' + opts.add + '" data-id="' + esc(id) + '" aria-label="' + label + ' hinzufügen"><span class="dot"></span>' + label + '<span class="plus" aria-hidden="true">+</span></button>';

function motif(o) { return o.art ? o : (DATA.famMotiv[o.fam] || DATA.famMotiv.holz); }
function artVars(o) { const c = motif(o).col; return "--a:" + c[0] + ";--a2:" + c[1] + ";--a3:" + c[2] + ";--b:" + c[3] + ";--tint:" + c[4]; }
function artSvg(o, cls) { return '<svg class="' + cls + '" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use href="#m-' + motif(o).art + '"/></svg>'; }
function lineGlyph(k) { return '<svg width="26" height="10" aria-hidden="true" focusable="false"><line class="ln ln-' + k + '" x1="3" y1="5" x2="23" y2="5"/></svg>'; }
/* Weiche Trennstellen in sehr langen Ölnamen, damit schmale Zeilen an der Wortfuge statt mitten im Wort umbrechen */
const SHY = ["Muskateller|salbei", "Bergamotten|minze", "Latschen|kiefer", "Wacholder|beere", "Schwarz|fichte", "Wacholder|holz", "Pfeffer|minze", "Hemlock|tanne", "Fichten|nadel", "Bitter|orange"];
const SHY_RE = new RegExp(SHY.map(w => w.replace("|", "")).join("|"), "g");
const SHY_MAP = Object.fromEntries(SHY.map(w => [w.replace("|", ""), w.replace("|", "­")]));
function hy(s) { return s.replace(SHY_RE, m => SHY_MAP[m]); }

function dbBanner() {

/* ---------- Mischungen und Aufgüsse auflösen ---------- */
function mixRef(ref) {
  const s = String(ref || ""), kind = s.slice(0, 2), id = s.slice(2);
  if (kind === "b:" && BLEND[id]) {
    const b = BLEND[id];
    return { ref: s, label: b.name, brand: b.brand, oils: blendIds(b), items: blendItems(b).map(x => x.label), more: b.more };
  }
  if (kind === "k:") {
    const k = S.kombis.find(x => x.id === id);
    if (k) return { ref: s, label: kombiTitle(k), brand: "Eigene Mischung", oils: k.oele.filter(x => OIL.has(x)), items: k.oele.map(x => (OIL.get(x) ? OIL.get(x).name : "gelöschtes Öl")), more: false };
  }
  if (kind === "o:" && OIL.has(id)) {
    const o = OIL.get(id);
    return { ref: s, label: o.name, brand: "Einzelöl", oils: [id], items: [o.name], more: false, single: true };
  }
  return { ref: s, label: kind === "o:" ? "Gelöschtes Öl" : "Gelöschte Mischung", brand: "", oils: [], items: [], more: false, missing: true };
}
function mixLabel(m) {
  if (m.missing || m.single) return m.label;
  return m.brand + " „" + m.label + "“";
}
function aufSummary(a) {
  const total = a.runden.reduce((s, r) => s + (r.dauer || 0), 0) || a.dauer || 0;
  const seen = new Set(), mixes = [];
  a.runden.forEach(r => { if (r.mischung && !seen.has(r.mischung)) { seen.add(r.mischung); mixes.push(mixRef(r.mischung)); } });
  const oils = Array.from(new Set([].concat.apply([], mixes.map(m => m.oils))));
  const music = a.runden.map((r, i) => ({ i: i, musik: r.musik })).filter(x => x.musik);
  return { total: total, mixes: mixes, oils: oils, music: music };
}
function musikHTML(s) {
  return String(s).split(/(https?:\/\/[^\s]+)/g).map((p, k) => (k % 2
    ? '<a href="' + esc(p) + '" target="_blank" rel="noopener">' + esc(p.length > 42 ? p.slice(0, 40) + "…" : p) + "</a>"
    : esc(p))).join("");
}

/* ---------- Eiskugel ---------- */
function legendHTML() {
  return '<div class="legend">' + ["gut", "regel", "offen"].map(k => '<span><svg width="30" height="12" aria-hidden="true"><line class="ln ln-' + k + '" x1="4" y1="6" x2="26" y2="6"/></svg>' + LEVELS[k] + "</span>").join("") + "</div>";
}
function labelLines(name) {
  if (name.length <= 11) return [name];
  const sp = name.lastIndexOf(" ", Math.ceil(name.length / 2) + 3);
  if (sp > 2) return [name.slice(0, sp), name.slice(sp + 1)];
  const hy = name.indexOf("-");
  if (hy > 2 && hy < name.length - 3) return [name.slice(0, hy + 1), name.slice(hy + 1)];
  const cut = Math.ceil(name.length / 2) + 1;
  return [name.slice(0, cut) + "-", name.slice(cut)];
}
function iceSvg(sel, pairs) {
  const n = sel.length, big = n > 6;
  const W = 420, H = big ? 330 : 300, cx = 210, cy = big ? 162 : 148, R = big ? 92 : 78;
  const pos = {};
  sel.forEach((id, i) => {
    const ang = -Math.PI / 2 + (i * 2 * Math.PI) / Math.max(n, 1);
    pos[id] = { x: cx + R * Math.cos(ang), y: cy + R * Math.sin(ang), c: Math.cos(ang), s: Math.sin(ang) };
  });
  const f1 = v => v.toFixed(1);
  let lines = "";
  for (const p of pairs) {
    const a = pos[p.a], b = pos[p.b], lv = LEVEL[p.i.best];
    lines += '<line class="ln ln-' + lv + '" x1="' + f1(a.x) + '" y1="' + f1(a.y) + '" x2="' + f1(b.x) + '" y2="' + f1(b.y) + '"><title>' + esc(OIL.get(p.a).name) + " + " + esc(OIL.get(p.b).name) + ": " + LEVELS[lv] + "</title></line>";
  }
  let nodes = "";
  for (const id of sel) {
    const o = OIL.get(id), p = pos[id];
    const ls = labelLines(shortName(o));
    const anchor = p.c > 0.3 ? "start" : p.c < -0.3 ? "end" : "middle";
    const lx = p.x + p.c * 22;
    let ly = p.y + p.s * 22;
    if (p.s > 0.3) ly += 14; else if (p.s < -0.3) ly -= (ls.length - 1) * 16 + 2; else ly += 5 - (ls.length - 1) * 8;
    const tspans = ls.map((t, k) => '<tspan x="' + f1(lx) + '"' + (k ? ' dy="16"' : "") + ">" + esc(t) + "</tspan>").join("");
    nodes += '<g style="' + famVar(o.fam) + '"' + (S.lastAdded === id ? ' class="node-new"' : "") + '><circle class="node-dot" cx="' + f1(p.x) + '" cy="' + f1(p.y) + '" r="12"/>' +
      '<text class="node-label" x="' + f1(lx) + '" y="' + f1(ly) + '" text-anchor="' + anchor + '"><title>' + esc(o.name) + "</title>" + tspans + "</text></g>";
  }
  const empty = n === 0 ? '<text class="ice-empty" x="' + cx + '" y="' + (cy + 5) + '" text-anchor="middle">Öle wählen</text>' : "";
  const title = n ? "Eiskugel mit " + sel.map(id => OIL.get(id).name).join(", ") : "Leere Eiskugel";
  return '<svg class="ball" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(title) + '">' +
    '<defs><radialGradient id="iceGrad" cx="38%" cy="32%" r="78%"><stop offset="0" style="stop-color: var(--surface)"/><stop offset=".55" style="stop-color: var(--ice); stop-opacity: .55"/><stop offset="1" style="stop-color: var(--ice); stop-opacity: .95"/></radialGradient></defs>' +
    '<ellipse class="ice-puddle" cx="' + cx + '" cy="' + (cy + R + 22) + '" rx="' + (R + 26) + '" ry="10"/>' +
    '<circle class="ice-ball" cx="' + cx + '" cy="' + cy + '" r="' + (R + 2) + '"/>' +
    '<ellipse class="ice-shine" cx="' + (cx - 30) + '" cy="' + (cy - 38) + '" rx="22" ry="11" transform="rotate(-30 ' + (cx - 30) + " " + (cy - 38) + ')"/>' +
    '<circle class="ice-speck" cx="' + (cx + 34) + '" cy="' + (cy - 46) + '" r="2.2"/><circle class="ice-speck" cx="' + (cx - 48) + '" cy="' + (cy + 20) + '" r="1.6"/><circle class="ice-speck" cx="' + (cx + 22) + '" cy="' + (cy + 44) + '" r="1.8"/>' +
    lines + nodes + empty + "</svg>";
}
function checkHTML(sel) {
  // Eiskugel mit Linien (zeigt, wie gut die Paare passen) und Warnhinweise; ein Urteil in Worten gibt es nicht mehr
  const pairs = [];
  for (let x = 0; x < sel.length; x++) for (let y = x + 1; y < sel.length; y++) pairs.push({ a: sel[x], b: sel[y], i: pairInfo(sel[x], sel[y]) });
  const warns = sel.map(id => OIL.get(id)).filter(o => o && o.warn);
  return '<div class="stage">' + iceSvg(sel, pairs) + legendHTML() + "</div>" +
    warns.map(o => '<div class="warnbox"><strong>' + esc(o.name) + ":</strong> " + esc(o.warn) + "</div>").join("");
}

/* Duftnoten-Balance beim Mischen: Sind Kopf, Herz und Basis abgedeckt? Für fehlende Noten passende Öle vorschlagen. */
function noteCandidates(sel, part) {
  // Öle mit der fehlenden Note, die zu allen gewählten Ölen passen (kein „unklar“), die bewährtesten zuerst
  const out = [];
  for (const o of OIL.values()) {
    if (sel.indexOf(o.id) >= 0 || String(o.note || "").indexOf(part) < 0) continue;
    let score = 0, strong = 0, ok = true;
    for (const s of sel) {
      const st = pairInfo(o.id, s).best;
      if (st === "offen") { ok = false; break; }
      if (st === "bewaehrt" || st === "passt" || st === "eigene") strong++;
      score += STATUS[st].w;
    }
    if (ok) out.push({ o: o, score: score, strong: strong });
  }
  out.sort((x, y) => y.strong - x.strong || y.score - x.score || byName(x.o, y.o));
  return out.slice(0, 3).map(x => x.o);
}
function noteBalance(sel, full) {
  // Eigener Abschnitt unter „Passt dazu“: Piktogramme mit Anzahl je Duftnote, für jede fehlende Note passende Öle
  const oils = sel.map(id => OIL.get(id)).filter(Boolean);
  if (!oils.length) return { html: "", ids: [] };
  const cnt = NOTE_KEYS.map(k => oils.filter(o => String(o.note || "").indexOf(k[1]) >= 0).length);
  const pills = NOTE_KEYS.map((k, i) => '<span class="bal-pill bal-' + k[0] + (cnt[i] ? " on" : "") + '" title="' + k[2] + (cnt[i] ? "" : " fehlt") + '">' + noteIcon(k[0]) +
    '<span class="bal-n">' + (cnt[i] || "–") + '</span><span class="sr">' + k[2] + ": " + cnt[i] + "</span></span>").join("");
  const missing = NOTE_KEYS.filter((k, i) => !cnt[i]), ids = [];
  const body = !missing.length
    ? '<p class="bal-msg bal-ok">Kopf, Herz und Basis sind abgedeckt.</p>'
    : missing.map(k => {
        const cand = full ? [] : noteCandidates(sel, k[1]);
        cand.forEach(o => ids.push(o.id));
        return '<p class="bal-msg">' + noteIcon(k[0]) + "Es fehlt eine " + k[2] + (cand.length ? ". Passend dazu:" : ".") + "</p>" +
          (cand.length ? '<div class="chips">' + cand.map(o => oilChip(o.id, { add: "sug-add" })).join("") + "</div>" : "");
      }).join("");
  return { html: '<section class="section balance"><h2 class="label">Duftnoten-Balance</h2><div class="bal-row">' + pills + "</div>" + body + "</section>", ids: ids };
}

  const partners = sel ? WHEEL.filter(x => famPartner(sel, x)) : [];
  const slices = WHEEL.map((fid, i) => {
    const f = FAM[fid], m = DATA.famMotiv[fid], mid = i * st;

      partners.map(x => '<button type="button" class="chip" style="' + famVar(x) + '" data-action="fam-go" data-fam="' + x + '"><span class="dot"></span>' + esc(FAM[x].name) + "</button>").join("") + "</div>"
    : '<p class="note wh-hint">Benachbarte Familien harmonieren. Zitrus, Minze und Nadelholz in der Mitte passen zu allen. Tippe eine Familie an, um alle passenden zu sehen.</p>';

/* ---------- Wege ---------- */
const ROOTS = ["oele", "mischungen", "aufguesse", "infos"];
const SECTION = { oele: "oele", fam: "oele", alle: "oele", oel: "oele", oelform: "oele", mischungen: "mischungen", mix: "mischungen", mischen: "mischungen", aufguesse: "aufguesse", auf: "aufguesse", aufgussform: "aufguesse", infos: "infos" };
const KEEP_SCROLL = ROOTS.concat(["fam", "alle"]);
const HIST = [];
let REPLACING = false, EXPECT = null;
function curHash() {
  let h = location.hash.slice(1);
  try { h = decodeURIComponent(h); } catch (err) { /* roh lassen */ }
  return h || "oele";
}
function parseRoute(h) {
  if (h === "eigene") h = "aufguesse";
  if (h === "kombi-check") h = "mischen";
  if (h.indexOf("oel-") === 0) return { view: "oel", id: h.slice(4) };
  if (h.indexOf("mix-") === 0) return { view: "mix", ref: h.slice(4) };
  if (h.indexOf("aufguss-") === 0) return { view: "auf", id: h.slice(8) };
  if (h.indexOf("familie-") === 0) return { view: "fam", id: h.slice(8) };
  if (h === "alle") return { view: "alle" };
  if (ROOTS.indexOf(h) >= 0 || h === "mischen" || h === "aufgussform" || h === "oelform") return { view: h };
  return { view: "oele" };
}
function nav(h) {
  if (curHash() === h) { S.route = parseRoute(h); render(); window.scrollTo(0, 0); return; }
  location.hash = h;
}
function replaceRoute(h) {
  if (curHash() === h) { S.route = parseRoute(h); render(); return; }
  REPLACING = true;
  location.replace("#" + h);
}
function goTo(h) {
  for (let i = HIST.length - 2; i >= Math.max(0, HIST.length - 4); i--) {
    if (HIST[i] === h) { EXPECT = i + 1; history.go(i - (HIST.length - 1)); return; }
  }
  replaceRoute(h);
}
function goBack() {
  if (HIST.length >= 2) history.back();
  else replaceRoute(SECTION[S.route.view] || "oele");
}
window.addEventListener("hashchange", () => {
  const h = curHash();
  const prev = HIST[HIST.length - 1];
  if (prev && KEEP_SCROLL.indexOf(parseRoute(prev).view) >= 0) S.scroll[prev] = window.scrollY;
  let back = false;
  if (EXPECT != null && HIST[EXPECT - 1] === h) { HIST.length = EXPECT; back = true; }
  else if (REPLACING && HIST.length) HIST[HIST.length - 1] = h;
  else if (HIST.length >= 2 && HIST[HIST.length - 2] === h) { HIST.pop(); back = true; }
  else HIST.push(h);
  EXPECT = null; REPLACING = false;
  if (HIST.length > 60) HIST.splice(0, HIST.length - 60);
  const r = parseRoute(h);
  if (r.view === "auf" && !back && !(S.route.view === "auf" && S.route.id === r.id)) S.aufTab = "runden";
  S.route = r;
  S.confirm = null;
  const focusing = !!S.focus;
  render();
  if (!focusing) window.scrollTo(0, back && KEEP_SCROLL.indexOf(r.view) >= 0 ? (S.scroll[h] || 0) : 0);
});

/* ---------- Rendern ---------- */
function render() {
  const r = S.route, sec = SECTION[r.view] || "oele";
  if (LIST_VIEWS.indexOf(r.view) >= 0) {
    const key = r.view === "fam" ? "familie-" + r.id : r.view;
    if (S.lastList && S.lastList !== key) S.query = "";
    S.lastList = key;
  }
  document.querySelectorAll(".nav").forEach(n => { if (n.dataset.nav === sec) n.setAttribute("aria-current", "page"); else n.removeAttribute("aria-current"); });
  const v = document.getElementById("view");
  const ae = document.activeElement;
  let keep = null;
  if (!S.focus && ae && ae.id && v.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) {
    keep = { id: ae.id, s: null, e: null };
    try { keep.s = ae.selectionStart; keep.e = ae.selectionEnd; } catch (err) { /* nicht jedes Feld kennt eine Auswahl */ }
  }
  let html;
  switch (r.view) {
    case "oel": html = viewOil(r.id); break;
    case "oelform": html = viewOilForm(); break;
    case "mischungen": html = viewBlends(); break;
    case "mix": html = viewMix(r.ref); break;
    case "mischen": html = viewMischen(); break;
    case "aufguesse": html = viewAuf(); break;
    case "auf": html = viewAufDetail(r.id); break;
    case "aufgussform": html = viewAufForm(); break;
    case "infos": html = viewInfo(); break;
    case "fam": html = viewFam(r.id); break;
    case "alle": html = viewAlle(); break;
    default: html = viewOils();
  }
  v.innerHTML = html;
  S.lastAdded = null;
  const target = S.focus || (keep && keep.id);
  if (target) {
    const el = document.getElementById(target);
    if (el) {
      el.focus({ preventScroll: !!keep });
      if (keep && keep.s != null) { try { el.setSelectionRange(keep.s, keep.e); } catch (err) { /* ignorieren */ } }
    }
  }
  S.focus = null;
  fitBanner();
  fitOilTitle();
}
// Langer Titel bei breiter Ersatzschrift: verkleinern, bis er links vom Motiv endet.
function fitBanner() {
  const t = document.querySelector(".banner-title"), art = document.querySelector(".banner-art");
  if (!t || !art) return;
  t.style.fontSize = "";
  const rg = document.createRange();
  rg.selectNodeContents(t);
  const tw = rg.getBoundingClientRect().width;
  const avail = art.getBoundingClientRect().left - t.getBoundingClientRect().left - 10;
  if (tw > avail && avail > 0) {
    const base = parseFloat(getComputedStyle(t).fontSize) || 42;
    t.style.fontSize = Math.max(28, Math.floor(base * avail / tw)) + "px";
  }
}
function fitOilTitle() {
  // Langer Ölname: Schrift verkleinern, bis das längste Wort in die Zeile passt (statt Silbentrennung)
  const t = document.querySelector(".oil-hero .page-title, .fam-hero .page-title");
  if (!t) return;
  t.style.fontSize = "";
  const words = t.textContent.split(/\s+/).filter(Boolean);
  const probe = document.createElement("span");
  probe.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap";
  t.appendChild(probe);
  let widest = 0;
  for (const w of words) { probe.textContent = w; widest = Math.max(widest, probe.getBoundingClientRect().width); }
  probe.remove();
  const cs = getComputedStyle(t);
  const width = t.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  if (widest > width && width > 0) t.style.fontSize = Math.max(18, Math.floor((parseFloat(cs.fontSize) || 40) * width / widest)) + "px";
}
window.addEventListener("resize", () => { fitBanner(); fitOilTitle(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitBanner(); fitOilTitle(); });

  S.busy = false; render();
}
function toMarkdown() {
  const nm = id => (OIL.get(id) ? OIL.get(id).name : "gelöschtes Öl");
  const flat = s => String(s || "").replace(/\s+/g, " ").trim();
  const lines = [];
  if (S.aufguesse.length) {
    lines.push("## Aufgüsse", "");
    S.aufguesse.slice().sort(byDate).forEach(a => {
      const sm = aufSummary(a);
      const meta = [a.runden.length + (a.runden.length === 1 ? " Runde" : " Runden")];
      if (sm.total) meta.push("ca. " + sm.total + " Min.");
      lines.push("### " + a.name + " (" + meta.join(", ") + ")", "");
      if (a.beschreibung) lines.push(a.beschreibung.trim(), "");
      lines.push("**Runden**", "");
      a.runden.forEach((r, i) => {
        const m = r.mischung ? mixRef(r.mischung) : null;
        const bits = [];
        if (m) bits.push(mixLabel(m) + (!m.missing && !m.single && m.items.length ? " (" + m.items.join(" + ") + (m.more ? " u. a." : "") + ")" : ""));
        if (r.musik) bits.push("Musik: " + flat(r.musik));
        if (r.notiz) bits.push(flat(r.notiz));
        lines.push((i + 1) + ". Runde " + (i + 1) + (r.dauer ? " (" + r.dauer + " Min.)" : "") + (bits.length ? ": " + bits.join(" · ") : ""));
      });
      lines.push("");
      if (sm.mixes.length) {
        lines.push("**Mischungen**", "");
        sm.mixes.forEach(m => lines.push("- " + (m.single ? "Einzelöl " + m.label : mixLabel(m) + (!m.missing && m.items.length ? ": " + m.items.join(" + ") + (m.more ? " u. a." : "") : ""))));
        lines.push("");
        if (sm.oils.length) lines.push("Benötigte Öle: " + sm.oils.map(nm).join(", "), "");
      }
      if (sm.music.length) {
        lines.push("**Musik**", "");
        sm.music.forEach((x, k) => lines.push((k + 1) + ". " + flat(x.musik) + " (Runde " + (x.i + 1) + ")"));
        lines.push("");
      }
      if (a.notizen) lines.push("**Notizen**", "", a.notizen.trim(), "");
    });
  }
  if (S.kombis.length) {
    lines.push("## Eigene Mischungen", "");
    S.kombis.slice().sort(byDate).forEach(k => lines.push("- **" + kombiTitle(k) + "** (" + moodName(k.stimmung) + "): " + k.oele.map(nm).join(" + ") + (k.notiz ? " – " + flat(k.notiz) : "")));
    lines.push("");
  }
  if (S.oele.length) {
    lines.push("## Eigene Öle", "");
    S.oele.slice().sort(byName).forEach(o => lines.push("- **" + o.name + "** (" + FAM[o.familie].name + (o.note ? ", " + o.note : "") + ")" + (o.duft ? ": " + o.duft : "") + (o.passt.length ? " – passt zu " + o.passt.map(nm).join(", ") : "") + (o.hinweis ? " – " + flat(o.hinweis) : "")));
  }
  return lines.join("\n").trim() + "\n";
}
async function copyMarkdown() {
  const md = toMarkdown();
  try {
    await navigator.clipboard.writeText(md);
    S.copyText = null;
    toast("Markdown kopiert");
    render();
  } catch (err) {
    S.copyText = md;
    S.focus = "copy-out";
    render();
    const ta = document.getElementById("copy-out");
    if (ta) ta.select();
  }
}

/* ---------- Start ---------- */
function start(saved) {
  saved = saved || {};
  if (typeof saved.query === "string") S.query = saved.query;
  if (saved.fam && FAM[saved.fam]) S.fam = saved.fam;
  if (saved.mood && (MOOD[saved.mood] || saved.mood === "eigene")) S.mood = saved.mood;
  if (saved.form && Array.isArray(saved.form.oele)) S.form = Object.assign(newForm(), saved.form, { err: "" });
  if (saved.oilForm && Array.isArray(saved.oilForm.passt)) S.oilForm = Object.assign(newOilForm(), saved.oilForm, { err: "" });
  if (saved.aufForm && Array.isArray(saved.aufForm.runden)) S.aufForm = Object.assign(newAufForm(), saved.aufForm, { err: "" });
  if (["runden", "mischungen", "musik"].indexOf(saved.aufTab) >= 0) S.aufTab = saved.aufTab;
  try { history.scrollRestoration = "manual"; } catch (err) { /* ältere Browser */ }
  const wanted = typeof saved.hash === "string" && saved.hash ? saved.hash : (ROOTS.indexOf(saved.view) >= 0 ? saved.view : "");
  if (!location.hash && wanted) { try { history.replaceState(null, "", "#" + wanted); } catch (err) { /* ignorieren */ } }
  const h = location.hash ? curHash() : (wanted || "oele");
  HIST.push(h);
  S.route = parseRoute(h);
  reindex();
  render();
  initDb();
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === "function") {
  hot.snapshot(() => ({ hash: curHash(), query: S.query, fam: S.fam, mood: S.mood, form: S.form, oilForm: S.oilForm, aufForm: S.aufForm, aufTab: S.aufTab }));
}
if (hot && typeof hot.ready === "function") hot.ready(start);
else start((hot && hot.data) || {});
})();
